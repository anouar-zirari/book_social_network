<div class="container mt-4">
  <div class="d-flex justify-content-start mb-3">
    <button class="btn btn-primary jh-create-entity" routerLink="/book/new">
      <fa-icon icon="plus"></fa-icon> <span>Create a new book</span>
    </button>
  </div>
  <div class="row">
    <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4" *ngFor="let book of books">
      <div class="card h-100">
        <img [src]="book.coverImage || 'assets/book-cover.png'" class="card-img-top" alt="Book cover" />

        <div class="card-body">
          <h5 class="card-title">{{ book.title }}</h5>
          <p class="card-text text-muted">{{ book.author }}</p>

          <ngb-rating [(rate)]="rating" />
        </div>
        <hr />
        <div class="text-end">
          <button class="btn btn-success">edit</button>
          <button class="btn btn-danger">Delete</button>
          <button class="btn btn-primary" routerLink="/book/book-details">details</button>
          <button class="btn btn-primary" routerLink="/book/borrow">Borow</button>
        </div>
      </div>
    </div>
  </div>
</div>
